<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>&#10084;</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1418; color: #f4ece8;
    }
    main { width: min(90vw, 420px); text-align: center; padding: 2rem; }
    .monogram { font-size: 3rem; letter-spacing: 0.1em; margin: 0 0 2rem; }
    form { display: flex; flex-direction: column; gap: 0.75rem; }
    input {
      padding: 0.85rem 1rem; font-size: 1rem; border: 1px solid #5a4a52;
      border-radius: 8px; background: #241c21; color: inherit; text-align: center;
    }
    input:focus { outline: none; border-color: #c98a9a; }
    button {
      padding: 0.85rem 1rem; font-size: 1rem; border: 0; border-radius: 8px;
      background: #c98a9a; color: #1a1418; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #d99caa; }
    .error { color: #e6a0a0; min-height: 1.2em; font-size: 0.9rem; }
    #content h1 { font-weight: 300; letter-spacing: 0.05em; }
    #content p { line-height: 1.6; color: #d8ccc6; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <section id="gate">
      <h1 class="monogram">A &amp; G</h1>
      <form id="gate-form">
        <input id="passphrase" type="password" placeholder="Passphrase"
               autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" required>
        <button type="submit">Enter</button>
        <p id="error" class="error" hidden>That passphrase didn&#39;t work &mdash; try again.</p>
      </form>
    </section>

    <section id="content" hidden>
      <h1 id="c-title"></h1>
      <p id="c-message"></p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
